services:
  mysql:
    image: mysql:8.4
    container_name: exa-kpi-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: exa_kpi_db
      MYSQL_USER: exa_user
      MYSQL_PASSWORD: exa_password
    ports:
      - "3306:3306"
    volumes:
      - exa_kpi_mysql_data:/var/lib/mysql

  adminer:
    image: adminer:latest
    container_name: exa-kpi-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exa-kpi-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      NODE_ENV: development
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: exa-kpi-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:4000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  exa_kpi_mysql_data:
