<!-- Option 3: Truck with E - Industry Specific -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#0d6efd"/>
  
  <!-- Truck outline -->
  <rect x="80" y="200" width="250" height="140" rx="10" fill="#ffffff"/>
  <rect x="280" y="240" width="120" height="100" rx="10" fill="#ffffff"/>
  
  <!-- Wheels -->
  <circle cx="140" cy="360" r="35" fill="#1e1e1e"/>
  <circle cx="140" cy="360" r="20" fill="#ffffff"/>
  <circle cx="340" cy="360" r="35" fill="#1e1e1e"/>
  <circle cx="340" cy="360" r="20" fill="#ffffff"/>
  
  <!-- Letter E on truck -->
  <path d="M 140 220 L 240 220 L 240 240 L 165 240 L 165 260 L 220 260 L 220 280 L 165 280 L 165 302 L 240 302 L 240 322 L 140 322 Z" 
        fill="#0d6efd"/>
</svg>

